services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jungle_wagering
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wagering"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.11
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
      - localstack-data:/var/lib/localstack

volumes:
  postgres-data:
  localstack-data:
